[package]
name = "vyges-ant"
version = "0.1.27"
edition = "2021"
description = "Antenna ratio sign-off over the routed OpenDB database (PAR/CAR/PSR/CSR), with diode-plan emission."
license = "Apache-2.0"
authors = ["Vyges <https://vyges.com/contact>"]
homepage = "https://vyges.com"
repository = "https://github.com/vyges-tools/ant"

[dependencies]
# The routed database is the substrate: metal per layer, pin gate area, and the LEF antenna
# rules all come from here. Reading a GDS instead would be a different check at a different
# stage — see vyges-drc, which does exactly that, post-stream.
vyges-opendb = { git = "https://github.com/vyges-tools/opendb.git", branch = "main" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Local development against the sibling checkouts. Patches are only honored from the
# root manifest, so this is a no-op for downstream consumers pulling us by git.
[patch."https://github.com/vyges-tools/opendb.git"]
vyges-opendb = { path = "../vyges-tools-opendb" }

[patch."https://github.com/vyges-tools/opendb-lib.git"]
vyges-opendb-lib = { path = "../vyges-tools-opendb-lib" }

[[bin]]
name = "vyges-ant"
path = "src/main.rs"

[lib]
name = "vyges_ant"
path = "src/lib.rs"
